[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ppt-agent"
version = "0.2.0"
description = "A durable, human-in-the-loop presentation authoring agent."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "openai>=1.0,<2",
  "pydantic>=2.6,<3",
  "PyYAML>=6.0,<7",
  "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_core*", "configs*", "model_router*", "runtime*", "storage*"]

[tool.setuptools]
py-modules = ["main", "main_front"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
